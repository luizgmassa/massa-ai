name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-1 (code-scanning #1/#6/#8/#9): least-privilege GITHUB_TOKEN. Without an
# explicit block every job inherits the repository default (write). `contents:
# read` covers checkout/artifacts; `pull-requests: read` is what
# dorny/paths-filter uses to diff PRs through the API. No job here writes to
# the repo, so nothing else is granted.
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # XP-04 AC-1: flipped to the dedicated-DB shape coverage.yml already
      # proves out, so isDedicatedDatabase() (scripts/check-coverage.ts) is
      # true here too and the DEDICATED_DB/RUN_POSTGRES_TESTS-gated suites
      # (23 files — see check-coverage.ts's assertDedicatedDatabase docblock)
      # execute in this blocking job instead of silently skipping. Literal
      # 127.0.0.1 (not localhost) and port 5433 are both load-bearing: the
      # predicate is a regex on this exact string.
      DATABASE_URL: postgresql://massa_ai:massa_ai_password@127.0.0.1:5433/massa_ai_test
      MASSA_AI_DEDICATED: "1"

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: massa_ai
          POSTGRES_PASSWORD: massa_ai_password
          POSTGRES_DB: massa_ai_test
        ports:
          # Host 5433 -> container 5432, mirroring coverage.yml. A second,
          # unrelated service was rejected (design.md C4): DEDICATED_DB reads
          # DATABASE_URL itself, so a side service can never satisfy it.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U massa_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Load-bearing for the stale-pointer gate below, which asks
          # `git log --all --name-only` whether a path ever existed in order to
          # tell a deliberate historical reference from a broken one. The action
          # defaults to fetch-depth: 1, where that log holds exactly one commit,
          # so every historical pointer falls through to BROKEN and the gate goes
          # red on a clean tree. Measured at b9781df with depth as the only
          # variable: depth 1 reports "28 broken, 0 historical", full history
          # reports "0 broken, historical exactly at its pin of 28". Costs one
          # 8.2 MB / 488-commit fetch. No other job in any workflow needs it.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # keep in sync with package.json packageManager
          bun-version: 1.3.14

      # Project's pinned Node (.node-version, currently 25.9) as the node-gyp
      # build helper for the native tree-sitter N-API addons. Ubuntu/gcc compiles
      # Node 25 V8 headers cleanly — unlike macos-14's Apple clang, which is why
      # the structural-native job stays on Node 22 (see comment there). Without
      # an explicit node, bun's install scripts intermittently fail: "could not
      # determine executable to run for package node-gyp" -> tree-sitter-*
      # install exits 1.
      - name: Setup Node (node-gyp build helper)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Reconcile npm to contract version (11.14.1)
        run: npm install -g npm@11.14.1

      # Bun's own install cache (~/.bun/install/cache, populated and read inside this
      # same job — nothing here restores it from actions/cache) intermittently races
      # the lifecycle scripts it feeds, and the casualty is always a native grammar:
      #   gyp ERR! stack Error: Cannot find module '../core/request.js'
      #   error: install script from "tree-sitter" exited with 1
      #   FileNotFound: failed copying files from cache to destination for package undici
      #   error: install script from "tree-sitter-clojure-orchard" exited with 1
      # Same family as the node-gyp resolution failure noted above, different trigger.
      # It took down the v1.4.0 release chain twice in one hour: CI run 30208529279
      # attempt 1, then publish run 30208930036, which left v1.4.0 tagged but unpublished.
      #
      # Purge the cache and retry once with serialized scripts. Attempt 2 of that same
      # commit passed unchanged, so a retry is the proportionate fix; `no-cache: true` on
      # setup-bun is not, because that input only skips caching the bun *executable*.
      # The happy path pays nothing: `&&` short-circuits straight to `exit 0`, and a
      # command before the final `&&` of an AND-list is exempt from `set -e`.
      #
      # `rm -rf` itself is not exempt: it is a standalone statement, so a non-zero exit
      # (run 30585845285, `Cannot find module './lib/interceptor/redirect'` — same undici
      # corruption class as above, but this time the offending package survived deletion:
      # `Directory not empty`) aborted the script under `-e` before the retry's own
      # `bun install` ever ran, defeating the one thing this block exists to do. `|| true`
      # makes the purge best-effort so the retry always gets its attempt.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed — purging Bun's install cache and retrying once"
          rm -rf ~/.bun/install/cache node_modules || true
          bun install --frozen-lockfile --concurrent-scripts 1

      - name: Deploy Prisma migrations
        run: cd packages/core && bunx prisma migrate deploy

      - name: Type check
        run: bun run type-check

      # DEBT-01. oxlint, correctness rules only. Runs before Build because it is
      # the cheapest gate in the job (single Rust binary over the whole repo) and
      # a violation should not wait on a full turbo build to surface.
      - name: Lint
        run: bun run lint

      # XP-03. Count-bounded allowlist over four dangerous-primitive classes
      # (child-process, Bun.spawn/Bun.$, raw-SQL $queryRawUnsafe/$executeRawUnsafe,
      # eval/new Function) via the TypeScript compiler API — never regex, so a
      # string literal, a comment, or RegExp.prototype.exec cannot match. A new
      # unreviewed site OR a stale entry (a site removed without updating the
      # list) both fail; dynamic-eval permits zero allowlist entries at all.
      # Runs beside Lint, before the full turbo Build, for the same cheap-gate-first
      # reasoning as DEBT-01 above.
      - name: Verify security allowlist (XP-03)
        run: bun scripts/check-security-allowlist.ts

      # XP-04 AC-2/3. Every test-running workflow's test-invocation env
      # (workflow ∪ job ∪ step env, projected onto a declared semantic key
      # set: DATABASE_URL, MASSA_AI_DEDICATED, RUN_POSTGRES_TESTS,
      # MASSA_AI_EXECUTOR_SANDBOX, RUN_E2E, RUN_E2E_DESTRUCTIVE, runner OS,
      # invocation string) must match another's, or the divergence must be
      # named in scripts/workflow-venue-parity-exceptions.txt. Reads the YAML
      # files directly, so it runs beside the security gate rather than
      # depending on anything Build produces.
      - name: Verify workflow venue parity (XP-04 AC-2/3)
        run: bun scripts/check-workflow-venue-parity.ts

      - name: Build
        run: bun run build

      # PDO-26. publish.yml's publish jobs have NO actions/checkout — they can only see
      # whatever the Build step's `build-output` artifact uploaded. This reproduces that
      # constrained filesystem (stage only the declared artifact paths, then `npm pack`
      # from inside the staged copy) so a package's `files` field silently outrunning the
      # artifact list fails here, before a release, rather than in a published tarball.
      # Must run after Build: it packs each package's real dist/ output.
      - name: Verify package contents (publish artifact parity)
        run: bun scripts/verify-package-contents.ts

      # GMS-01/G-HUB. The facade's hub metric: no declared type may be read more
      # than MAX_FOREIGN_REACH members deep from another file, and no file may
      # exceed MAX_FILE_LOC. Both thresholds are the script's committed defaults,
      # so tightening one is a source edit and shows up in review.
      #
      # The directory is a REQUIRED positional. Omitting it exits 2 with a usage
      # error — which fails the job while measuring nothing, and reads in the log
      # exactly like a working gate — so it is spelled out rather than defaulted.
      # Deliberately not `--json`: on a pass the script appends a non-JSON banner
      # to stdout, so the JSON form parses only when the gate is already red.
      - name: Verify search facade hub metric (G-HUB)
        run: bun scripts/search-hub-metric.ts packages/core/src/services/search

      # GMS-01 AC-1. The core layer contract, enforced rather than asserted.
      # Kernel rule (PR-C T5): a file under packages/core/src/kernel/ may import
      # from no tier, and data/ may not import services/ while data/ -> kernel/
      # stays legal. Membership is a path prefix — `git mv` grants it — and there
      # is no allowlist, deliberately: an accepted exception makes a NEW edge of
      # the same shape indistinguishable from the recorded ones.
      #
      # Reads a live edge count on a pass as well as a fail, because a check that
      # resolved nothing also reports zero violations and the two must not look
      # alike in the log. T15 adds the controllers rule to the same table.
      - name: Verify core layer contract (GMS-01 AC-1)
        run: bun scripts/check-core-layering.ts

      # GMS-02 / RFS-01 AC-1 (PR-D). The tools-tier thinness contract: a file
      # under packages/core/src/tools/ declares no function body beyond handle()
      # and the constructor, holds no Map/Set state, and keeps handle() at or
      # under 120 lines — schema + delegation only. Zero allowlist, on the
      # layering gate's stated ground: an accepted exception is indistinguishable
      # from a new violation of the same shape.
      #
      # Prints its examined population on a PASS (file count, handler split,
      # members) because a run that resolved nothing reports zero violations
      # exactly like a clean tree, and the two must not read alike in the log.
      # A violation prints per-file findings and exits 1. Structural only: the
      # script's own docblock names what it does not certify (RFS-01 AC-6).
      - name: Verify tools-tier thinness (GMS-02 / RFS-01 AC-1)
        run: bun scripts/check-tools-thin.ts

      # GMS-04 AC-3. Classifies every path-shaped pointer at a renamed module as
      # RESOLVES, HISTORICAL or BROKEN. Broken must be 0 and historical must sit
      # exactly on its pin, so a newly dangling pointer and a silently dropped
      # historical one both fail here. Requires full git history — see the
      # fetch-depth note on the checkout step above.
      - name: Verify no stale module pointers (GMS-04 AC-3)
        run: bun scripts/check-stale-pointers.ts

      # PDO-06/07. Same drift-gate shape as the subagent-artifact check
      # (scripts/generate-subagent-artifacts.ts --check, exercised via
      # scripts/__tests__/subagent-parity.test.ts in the Test scripts step
      # below), run explicitly here too so a stale apps/*-plugin/skills/ bundle
      # fails loudly and early rather than only inside the isolated test run.
      - name: Verify skill-bundle artifacts (drift gate)
        run: bun scripts/generate-skill-artifacts.ts --check

      - name: Detect grammar-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            grammar:
              - 'packages/core/src/services/structural/**'
              - 'packages/core/prisma/migrations/**'
              - 'scripts/verify-tree-sitter*.ts'
            changelog:
              - 'CHANGELOG.md'

      - name: Grammar integrity verifier
        if: steps.filter.outputs.grammar == 'true'
        run: bun run verify:tree-sitter-native

      - name: CHANGELOG merge gate
        if: github.event_name == 'pull_request' && steps.filter.outputs.changelog == 'false' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') && github.event.pull_request.user.type != 'Bot'
        run: |
          echo "❌ CHANGELOG.md not modified. Add an entry under [Unreleased] or apply the 'no-changelog' label."
          echo "Bot-authored PRs (Dependabot, etc.) are exempt."
          exit 1

      - name: Test
        run: bun run test
        env:
          MASSA_AI_EXECUTOR_SANDBOX: none
          # XP-04 AC-1. Turbo sandboxes the environment (AD-010) — without
          # RUN_POSTGRES_TESTS in turbo.json's passThroughEnv (T2), setting it
          # here would be a silent no-op under `bun run test` = `turbo run test`.
          RUN_POSTGRES_TESTS: "1"

      - name: Test scripts (root-level suites)
        run: bun run test:scripts

      # apps/{claude,codex,cursor}-plugin are not workspace packages (no
      # package.json), so turbo's `test` never reaches them. They install into a
      # temp $HOME, so they are safe to run here.
      - name: Test plugin installers
        run: bun run test:plugins

  mcp:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: massa_ai
          POSTGRES_PASSWORD: massa_ai_password
          POSTGRES_DB: massa_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: massa-ai-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          push: false
          load: true
          tags: massa-ai-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start API container
        run: |
          docker run -d --name massa-ai-api \
            --network host \
            -e DATABASE_URL="postgresql://massa_ai:massa_ai_password@localhost:5432/massa_ai" \
            -e NODE_ENV=test \
            -p 3333:3333 \
            massa-ai-api:test

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3333/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 20s"
          docker logs massa-ai-api
          exit 1

      - name: Health check
        run: |
          STATUS=$(curl -sf http://localhost:3333/health | jq -r '.status')
          echo "Health status: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

      - name: Verify Swagger docs
        run: curl -sf http://localhost:3333/swagger | head -1

      # The web UI is static files read from apps/web-ui/src/static at request
      # time. If that dir is missing from the image, /health and /swagger still
      # pass while /ui returns 500 — so assert the shell and an asset directly.
      - name: Verify Web UI is served
        run: |
          CT=$(curl -sf -o /tmp/ui.html -w '%{content_type}' http://localhost:3333/ui) || {
            echo "GET /ui failed"; curl -s -i http://localhost:3333/ui | head -20; exit 1; }
          echo "Content-Type: $CT"
          case "$CT" in text/html*) ;; *) echo "expected text/html, got $CT"; exit 1;; esac
          grep -q '<!DOCTYPE html>' /tmp/ui.html || { echo "no HTML shell in /ui"; head -5 /tmp/ui.html; exit 1; }
          curl -sf http://localhost:3333/ui/app.js > /dev/null || { echo "GET /ui/app.js failed"; exit 1; }

      # SEC-06 / Plan Challenge finding 3. The container above runs with
      # --network host, which bypasses the bridge and reports loopback, so it
      # cannot answer the question docker-compose actually poses: what address
      # does a host request present through a published port mapping? This step
      # measures that on a bridge-mapped container and prints it. Setting the
      # flag makes the suite FAIL rather than skip if no runtime is present, so
      # a measurement that did not happen can never read as one that passed.
      - name: Measure the Docker bridge remote address
        env:
          MASSA_AI_DOCKER_PROBE: "1"
          MASSA_AI_DOCKER_PROBE_PORT: "3334"
        run: bash scripts/tests/test-docker-remote-address.sh

      - name: Cleanup
        if: always()
        run: docker rm -f massa-ai-api 2>/dev/null || true

  structural-native:
    name: Structural native tests (darwin-arm64)
    # Native Tree-sitter grammars are built/loaded only on macOS arm64
    # and Linux glibc x64 (grammar-loaders.ts assertRuntimeTarget). The
    # structural-* suites are skipped on other platforms via describeNative
    # in the tests; this job runs them for real on macOS. Replaces the
    # former .github/workflows/native-macos-arm64.yml.
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          # keep in sync with package.json packageManager
          bun-version: 1.3.14

      # tree-sitter's N-API addon compiles via node-gyp during `bun install`.
      # Pin Node 22 LTS: its V8 headers compile cleanly under the macos-14
      # Apple clang. Node 25 V8 headers use a braced-init-list template arg
      # (`ReadExternalPointerField<{...}>`) that macos-14's clang rejects
      # ("error: expected expression"), breaking the native build. The addon
      # is N-API (ABI-stable), so the Node major is irrelevant to runtime
      # loading under Bun — 22 is purely the build-helper toolchain here.
      - name: Setup Node 22 LTS (node-gyp build helper)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Purge-and-retry against the Bun install-cache race — see the `build` job for the
      # full signature and why this is not a composite action.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed — purging Bun's install cache and retrying once"
          rm -rf ~/.bun/install/cache node_modules || true
          bun install --frozen-lockfile --concurrent-scripts 1

      - name: Build workspace
        run: bun run build

      - name: Run native-structural unit tests
        working-directory: packages/core
        run: bun scripts/run-tests-isolated.ts --unit --filter='structural|parse-long-class'

  structural-native-linux:
    name: Structural native tests (linux-x64)
    # M21: Linux glibc x64 native structural runtime. Parallel to the
    # macOS arm64 job above. Native Tree-sitter grammars build via node-gyp
    # under Node 25.9.0 (C++20 binding.gyp) or Node 22 LTS fallback if the
    # Linux toolchain rejects Node 25 headers (same braced-init-list issue
    # as macos-14). The addon is N-API (ABI-stable), so runtime loading
    # under Bun 1.3.14 is unaffected by the build-helper Node major.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node 25.9.0 (node-gyp build helper)
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'

      - name: Reconcile npm to contract version (11.14.1)
        run: npm install -g npm@11.14.1

      # This job's install is where the race actually fired on CI run 30208529279
      # attempt 1. Purge-and-retry — see the `build` job for the full signature.
      - name: Install dependencies (build native addon from source)
        run: |
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed — purging Bun's install cache and retrying once"
          rm -rf ~/.bun/install/cache node_modules || true
          bun install --frozen-lockfile --concurrent-scripts 1

      - name: Build workspace
        run: bun run build

      - name: Run native verifier (source/dist + packed package)
        run: bun run verify:tree-sitter-native | tee native-linux-x64-verification.log

      - name: Run native-structural unit tests
        working-directory: packages/core
        run: bun scripts/run-tests-isolated.ts --unit --filter='structural|parse-long-class'

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64-verification.log
          path: native-linux-x64-verification.log
          if-no-files-found: error
