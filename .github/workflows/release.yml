name: Release

# Auto-release on merge to main (spec: .specs/features/auto-release-versioning/).
#
# Chain: merge PR -> CI -> this workflow -> publish.yml (reusable).
#
# It deliberately does NOT rely on `push: tags` or `release: published` firing. The
# GitHub Release below is created with GITHUB_TOKEN, and a tag or release created with
# GITHUB_TOKEN raises no event — GitHub's documented recursion guard — so `publish.yml` is
# sequenced with `workflow_call` instead of an event.
#
# Loop safety (ARV-R12) does NOT come from that guard any more. The bump commit is pushed
# with a deploy key (see the checkout step), which does raise events. `[skip ci]` in the
# commit subject is what prevents the recursion, backed by the fact that a second run
# would find an empty [Unreleased] and derive no bump.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize releases: two merges landing together must not race on the tag. Never
  # cancel — an in-flight run may be mid-push.
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A `completed` workflow_run can also be a failure, which must not release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.push.outputs.released }}
      version: ${{ steps.derive.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Commit on top of current main, not the historical head_sha — otherwise the
          # push is guaranteed to be rejected whenever main has moved.
          ref: main
          fetch-depth: 0
          # Push as the `release-bot` deploy key, NOT GITHUB_TOKEN. The branch ruleset
          # on main requires a PR and 5 status checks, so GITHUB_TOKEN's push is rejected
          # with `GH013: Repository rule violations found`. The ruleset's bypass list is
          # the only way through, and on a user-owned repo GitHub Actions cannot be a
          # bypass actor ("must be part of the ruleset source or owner organization") —
          # a write-enabled deploy key can. It is repo-scoped and git-only: no API
          # access, no other repository, no expiry.
          #
          # Consequence: a deploy-key push DOES raise events, unlike GITHUB_TOKEN. The
          # `[skip ci]` in the commit subject below is therefore load-bearing, not
          # defensive — without it the bump commit starts CI, and a green CI on main is
          # exactly what triggers this workflow. (A second run would still terminate:
          # the promoted [Unreleased] is empty, so it derives no bump. `[skip ci]` is
          # the first line of defence, that emptiness the second.)
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # keep in sync with package.json packageManager
          bun-version: 1.3.14

      - name: Derive next version from CHANGELOG
        id: derive
        run: |
          RESULT=$(bun scripts/release-version.ts)
          VERSION=$(node -p 'JSON.parse(process.argv[1]).next ?? ""' "$RESULT")

          if [ -z "$VERSION" ]; then
            echo "[Unreleased] holds no releasable entry — skipping release (ARV-R3)."
            exit 0
          fi

          # Release notes go through a file, never a shell variable: changelog bodies
          # here are full of backticks, $, and newlines.
          node -p 'JSON.parse(process.argv[1]).notes' "$RESULT" > notes.md

          {
            echo "version=$VERSION"
            echo "bump=$(node -p 'JSON.parse(process.argv[1]).bump' "$RESULT")"
          } >> "$GITHUB_OUTPUT"

          echo "Derived v$VERSION from $(node -p 'JSON.parse(process.argv[1]).current' "$RESULT")"

      - name: Commit, tag and push
        id: push
        if: steps.derive.outputs.version != ''
        env:
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists — refusing to overwrite a release"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add package.json CHANGELOG.md
          git add -u packages apps
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"

          # --atomic: commit and tag land together or not at all.
          git push --atomic origin main "v$VERSION"

          # Only now is the release real. Downstream jobs gate on this.
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.push.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --verify-tag

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      ref: v${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
