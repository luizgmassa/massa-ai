name: Build and Publish

# Reusable publish workflow. The only automatic caller is release.yml, which passes the
# tag it just created.
#
# There is deliberately no `release: published`, `push: tags`, or `workflow_run` trigger:
# a tag or release created with GITHUB_TOKEN raises no event (GitHub's recursion guard),
# so those triggers would be dead. Keeping them would only create a second, divergent
# publish path. A manual release goes through release.yml's workflow_dispatch.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag or SHA to publish (e.g. v1.3.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to publish (e.g. v1.3.0)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always an explicit, caller-supplied ref. The old
          # `workflow_run.head_sha || github.ref` fallback is gone: with `ref` optional it
          # silently published the tip of main as `latest`.
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # keep in sync with package.json packageManager
          bun-version: 1.3.14

      # This exact step is what stranded v1.4.0: the tag and the GitHub Release were
      # already pushed when it died on Bun's install-cache race (run 30208930036,
      # `FileNotFound ... undici` -> `tree-sitter-clojure-orchard` exit 1), skipping all
      # four publish jobs. Purge-and-retry — see ci.yml's `build` job for the signature.
      #
      # Deliberately inline rather than a `uses: ./.github/actions/...` composite action.
      # A local action resolves from the *checked-out* tree, and this job checks out
      # `inputs.ref`; a composite would be unresolvable on every tag older than itself —
      # which is precisely the republish-an-old-tag case this fix has to survive. An
      # inline `run:` comes from the workflow file, which is always main's copy.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile && exit 0
          echo "::warning::bun install failed — purging Bun's install cache and retrying once"
          rm -rf ~/.bun/install/cache node_modules
          bun install --frozen-lockfile --concurrent-scripts 1

      - name: Build all packages and apps
        run: bun run build

      - name: Sync versions from root package.json
        run: bun scripts/version-sync.ts

      - name: Resolve workspace dependencies
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Resolving workspace:* → ^$VERSION"

          for pkg in packages/core/package.json apps/*/package.json; do
            if grep -q '"workspace:\*"' "$pkg"; then
              sed -i "s|\"workspace:\*\"|\"^$VERSION\"|g" "$pkg"
              echo "  ✓ Resolved in $pkg"
            fi
          done

      # Uploaded AFTER the resolve step on purpose: the publish jobs must receive
      # manifests whose deps are pinned to ^X.Y.Z, never `workspace:*`.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/shared/dist
            packages/shared/package.json
            packages/core/dist
            packages/core/prisma
            packages/core/package.json
            apps/tools-api/dist
            apps/tools-api/package.json
            apps/mcp-client/dist
            apps/mcp-client/package.json
            apps/opencode-plugin/dist
            apps/opencode-plugin/package.json
          retention-days: 1

  publish-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Every publish below is guarded by an already-published check, which is what makes
      # a manual `workflow_dispatch` at a stuck tag a safe retry rather than a guaranteed
      # `403 EPUBLISHCONFLICT` on the first package that did land. v1.4.0 needed exactly
      # this: `build` failed, so nothing published, but a partial failure mid-way through
      # these five steps is the shape the guard really exists for.
      #
      # A transient `npm view` failure reads as "not published" and the publish then fails
      # on the real conflict. That is deliberate: a loud stop beats silently skipping a
      # package that was never actually published.
      - name: Publish @massa-ai/shared
        working-directory: packages/shared
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@massa-ai/shared@$VERSION" version >/dev/null 2>&1; then
            echo "@massa-ai/shared@$VERSION already on npm — skipping"
            exit 0
          fi
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @massa-ai/core
        working-directory: packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@massa-ai/core@$VERSION" version >/dev/null 2>&1; then
            echo "@massa-ai/core@$VERSION already on npm — skipping"
            exit 0
          fi
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-apps:
    needs: [build, publish-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Same already-published guard as publish-packages; see the comment there.
      - name: Publish @massa-ai/tools-api
        working-directory: apps/tools-api
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@massa-ai/tools-api@$VERSION" version >/dev/null 2>&1; then
            echo "@massa-ai/tools-api@$VERSION already on npm — skipping"
            exit 0
          fi
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @massa-ai/mcp-client
        working-directory: apps/mcp-client
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@massa-ai/mcp-client@$VERSION" version >/dev/null 2>&1; then
            echo "@massa-ai/mcp-client@$VERSION already on npm — skipping"
            exit 0
          fi
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @massa-ai/opencode-plugin
        working-directory: apps/opencode-plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@massa-ai/opencode-plugin@$VERSION" version >/dev/null 2>&1; then
            echo "@massa-ai/opencode-plugin@$VERSION already on npm — skipping"
            exit 0
          fi
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    # Must NOT race the npm jobs. If npm publishes shared+core then fails on tools-api,
    # publishing all five here would leave the two registries divergent at one version.
    needs: [build, publish-packages, publish-apps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@luizgmassa'

      # Its own copy of the artifact. This job rewrites package.json, and a rewritten
      # manifest must never be what reaches registry.npmjs.org.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # GitHub Packages resolves an npm scope to a GitHub owner, and `@massa-ai` is not
      # one — the repo is luizgmassa/massa-ai — so `@massa-ai/core` fails with
      # `403 Permission not_found: owner not found`. Republish under the owner scope.
      # The dependency keys must be rewritten too, or @luizgmassa/tools-api would depend
      # on @massa-ai/core, which does not exist on this registry.
      - name: Rewrite manifests for the @luizgmassa scope
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('fs');

          const manifests = [
            'packages/shared/package.json',
            'packages/core/package.json',
            'apps/tools-api/package.json',
            'apps/mcp-client/package.json',
            'apps/opencode-plugin/package.json',
          ];
          const rescope = (n) => n.replace(/^@massa-ai\//, '@luizgmassa/');

          for (const file of manifests) {
            const pkg = JSON.parse(readFileSync(file, 'utf8'));
            pkg.name = rescope(pkg.name);

            for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              if (!pkg[field]) continue;
              pkg[field] = Object.fromEntries(
                Object.entries(pkg[field]).map(([name, range]) => [rescope(name), range]),
              );
            }

            // GitHub Packages routes a package to its repository via this URL.
            pkg.repository = { type: 'git', url: 'https://github.com/luizgmassa/massa-ai.git' };
            pkg.publishConfig = { ...pkg.publishConfig, registry: 'https://npm.pkg.github.com' };

            writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`  ✓ ${file} → ${pkg.name}`);
          }
          NODE

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dependency order: shared -> core -> apps.
          # Names are read back from the manifests the rescope step just rewrote, so the
          # already-published check queries @luizgmassa/*, not @massa-ai/*.
          for dir in packages/shared packages/core apps/tools-api apps/mcp-client apps/opencode-plugin; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on GitHub Packages — skipping"
              continue
            fi
            echo "Publishing $dir as $NAME@$VERSION"
            (cd "$dir" && npm publish --tag latest)
          done

  publish-docker:
    needs: build
    # Docker multi-arch builds are heavy and OPTIONAL — npm package publishing is the
    # Publish contract. Tolerate failure so a missing DockerHub credential never fails
    # the release.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # No DOCKERHUB_* secret is configured on this repository, so every release so far has
    # logged `##[error]Username and password required` from the login step and leaned on
    # continue-on-error to survive it. A red error that is expected trains you to ignore
    # red errors, so gate the work on the credential actually being present.
    #
    # The gate has to live here rather than in a job-level `if:`: the `secrets` context is
    # not available to job-level conditions, but job-level `env:` may read it and
    # step-level `if:` may read `env`. Deleting this job instead would be premature — CI
    # already builds and smoke-tests both targets, but nothing else *publishes* them.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Report skip when DockerHub is not configured
        if: env.DOCKERHUB_TOKEN == ''
        run: |
          echo "DOCKERHUB_TOKEN is unset — skipping image publish. This is not a failure."
          echo "To enable: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets."
          echo "Confirm the image namespace first: the tags below say massa/massa-ai, which"
          echo "may not be the namespace this repository's owner controls."

      - name: Checkout repository
        if: env.DOCKERHUB_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from package.json
        if: env.DOCKERHUB_TOKEN != ''
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker meta for API
        if: env.DOCKERHUB_TOKEN != ''
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: massa/massa-ai
          tags: |
            type=raw,value=api-${{ steps.version.outputs.version }}
            type=raw,value=api-latest

      - name: Docker meta for MCP
        if: env.DOCKERHUB_TOKEN != ''
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: massa/massa-ai
          tags: |
            type=raw,value=mcp-${{ steps.version.outputs.version }}
            type=raw,value=mcp-latest

      - name: Build and push API image
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP image
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
