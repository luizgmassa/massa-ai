name: Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  # NO `paths:` filter here, deliberately. `validate` is a required status check in the
  # `main` branch ruleset, and a required check that does not run never reports — the PR
  # then sits forever on "Expected — waiting for status to be reported" instead of failing.
  # Path-filtering a required check is a deadlock, not an optimisation. The job is
  # checkout + frontmatter greps (~8s), so running it on every PR costs nothing.
  # `push` above stays filtered: nothing requires it there.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SKILL.md
        run: |
          # Both the top-level skills and the sub-agent charters. The charters
          # were previously unvalidated, so a charter could ship without a
          # description or a model hint and only fail at generator runtime.
          for skill in skills/*/SKILL.md skills/agents/*/SKILL.md; do
            echo "Validating $skill"

            if [ ! -f "$skill" ]; then
              echo "Error: SKILL.md not found"
              exit 1
            fi

            if ! grep -q "^---$" "$skill"; then
              echo "Error: Missing YAML frontmatter in $skill"
              exit 1
            fi

            if ! grep -q "^name:" "$skill"; then
              echo "Error: Missing 'name' in frontmatter of $skill"
              exit 1
            fi

            if ! grep -q "^description:" "$skill"; then
              echo "Error: Missing 'description' in frontmatter of $skill"
              exit 1
            fi

            case "$skill" in
              skills/agents/*)
                # Charter-only fields consumed by scripts/generate-subagent-artifacts.ts
                if ! grep -q "^  model_hint:" "$skill"; then
                  echo "Error: Missing 'metadata.model_hint' in $skill"
                  exit 1
                fi
                if ! grep -qE "^  permission: (read-only|write)$" "$skill"; then
                  echo "Error: Missing or invalid 'metadata.permission' in $skill"
                  exit 1
                fi
                ;;
            esac

            echo "✓ $skill is valid"
          done

      - name: List available skills
        run: |
          {
            echo "## Available Skills"
            echo ""
            for skill in skills/*/SKILL.md; do
              name=$(grep "^name:" "$skill" | head -1 | sed 's/name: *//')
              desc=$(grep "^description:" "$skill" | head -1 | sed 's/description: *//')
              echo "- **$name**: $desc"
            done
            echo ""
            echo "## Sub-Agent Charters"
            echo ""
            for skill in skills/agents/*/SKILL.md; do
              name=$(grep "^name:" "$skill" | head -1 | sed 's/name: *//')
              perm=$(grep "^  permission:" "$skill" | head -1 | sed 's/  permission: *//')
              echo "- **massa-ai-$name** ($perm)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  install-test:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test skill installation
        run: |
          npx skills add ${{ github.repository }} --list
        env:
          DISABLE_TELEMETRY: 1
