name: Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  # NO `paths:` filter here, deliberately. `validate` is a required status check in the
  # `main` branch ruleset, and a required check that does not run never reports — the PR
  # then sits forever on "Expected — waiting for status to be reported" instead of failing.
  # Path-filtering a required check is a deadlock, not an optimisation. The job is
  # checkout + frontmatter greps (~8s), so running it on every PR costs nothing.
  # `push` above stays filtered: nothing requires it there.
  pull_request:
    branches: [main]
  workflow_dispatch:

# SEC-1 (code-scanning #5/#7): least-privilege GITHUB_TOKEN — checkout + greps
# only, nothing here writes to the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SKILL.md
        run: |
          # Both the top-level skills and the sub-agent charters. The charters
          # were previously unvalidated, so a charter could ship without a
          # description or a model hint and only fail at generator runtime.
          for skill in skills/*/SKILL.md skills/agents/*/SKILL.md; do
            echo "Validating $skill"

            if [ ! -f "$skill" ]; then
              echo "Error: SKILL.md not found"
              exit 1
            fi

            if ! grep -q "^---$" "$skill"; then
              echo "Error: Missing YAML frontmatter in $skill"
              exit 1
            fi

            if ! grep -q "^name:" "$skill"; then
              echo "Error: Missing 'name' in frontmatter of $skill"
              exit 1
            fi

            if ! grep -q "^description:" "$skill"; then
              echo "Error: Missing 'description' in frontmatter of $skill"
              exit 1
            fi

            case "$skill" in
              skills/agents/*)
                # Charter-only fields consumed by scripts/generate-subagent-artifacts.ts
                if ! grep -q "^  model_hint:" "$skill"; then
                  echo "Error: Missing 'metadata.model_hint' in $skill"
                  exit 1
                fi
                # metadata.model_tier is the charter's capability tier. It must be one of
                # the tiers declared in skills/model-profiles.json, which is the single
                # source for what a tier resolves to per host. Checked against that file
                # rather than a hard-coded list, so adding a tier stays a one-file change.
                #
                # Deliberately a two-stage pipeline over the single `"tiers"` line, not a
                # `sed` range and not a process substitution:
                #   - `sed -n '/"tiers"/,/]/p'` reads the range's OPENING line as its start,
                #     then hunts for the next `]` on a LATER line — swallowing every profile
                #     body (165 lines here) and matching a tier name anywhere inside it.
                #   - `grep -q pattern <(...)` is shell-dependent; it silently reports no
                #     match under zsh while working under bash.
                # This form is POSIX, matches only the declaration, and fails CLOSED: if the
                # tiers array is ever reformatted across lines it rejects valid tiers rather
                # than accepting invalid ones.
                tier="$(sed -n 's/^  model_tier: *\([A-Za-z0-9_-]*\).*$/\1/p' "$skill" | head -n1)"
                if [ -z "$tier" ]; then
                  echo "Error: Missing 'metadata.model_tier' in $skill"
                  exit 1
                fi
                if ! grep -m1 '"tiers"' skills/model-profiles.json | grep -q "\"$tier\""; then
                  echo "Error: 'metadata.model_tier: $tier' in $skill is not a tier declared in skills/model-profiles.json"
                  exit 1
                fi
                if ! grep -qE "^  permission: (read-only|write)$" "$skill"; then
                  echo "Error: Missing or invalid 'metadata.permission' in $skill"
                  exit 1
                fi
                ;;
            esac

            echo "✓ $skill is valid"
          done

      - name: List available skills
        run: |
          {
            echo "## Available Skills"
            echo ""
            for skill in skills/*/SKILL.md; do
              name=$(grep "^name:" "$skill" | head -1 | sed 's/name: *//')
              desc=$(grep "^description:" "$skill" | head -1 | sed 's/description: *//')
              echo "- **$name**: $desc"
            done
            echo ""
            echo "## Sub-Agent Charters"
            echo ""
            for skill in skills/agents/*/SKILL.md; do
              name=$(grep "^name:" "$skill" | head -1 | sed 's/name: *//')
              perm=$(grep "^  permission:" "$skill" | head -1 | sed 's/  permission: *//')
              echo "- **massa-ai-$name** ($perm)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  install-test:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test skill installation
        run: |
          npx skills add ${{ github.repository }} --list
        env:
          DISABLE_TELEMETRY: 1
