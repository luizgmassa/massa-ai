# Bun configuration for MCP RLM Mem0

[test]
# Test configuration
# preload = []
#
# Coverage is NOT enabled globally (DEBT-02). It was, and every `bun test`
# invocation — including a single-file run during a debug loop — paid to
# instrument and report it. It is now an explicit gate: `bun run test:coverage`,
# which enforces the floor and the documented exclusions in
# `scripts/check-coverage.ts`. Pass `--coverage` yourself for an ad-hoc run.
coverageDir = "./coverage"

# Test pattern matching
testMatch = ["**/*.test.ts", "**/*.spec.ts"]
testIgnore = ["**/node_modules/**", "**/dist/**"]

# Timeout
timeout = 5000

[install]
# Package installation config
registry = "https://registry.npmjs.org"
